name: Build VPK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the VPK to a release when you push a tag

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          command -v cmake >/dev/null && command -v make >/dev/null || apk add --no-cache cmake make
          cmake --version

      - name: Check libraries (install any that are missing)
        run: |
          echo "VITASDK=$VITASDK"
          missing=0
          for lib in libcurl.a libssl.a libcrypto.a libvita2d.a libfreetype.a libpng.a libjpeg.a libz.a; do
            if [ -f "$VITASDK/arm-vita-eabi/lib/$lib" ]; then echo "found   $lib"; else echo "MISSING $lib"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            "$VITASDK/bin/vdpm" curl openssl vita2d freetype libpng libjpeg-turbo zlib
          fi

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j"$(nproc)"
          ls -la build/VitaGitHub.vpk

      - uses: actions/upload-artifact@v5
        with:
          name: VitaGitHub
          path: build/VitaGitHub.vpk
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VitaGitHub.vpk
