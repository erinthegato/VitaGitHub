name: Build VPK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the VPK to a release when you push a tag

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Install build tools
        run: apk add --no-cache cmake make bash curl ca-certificates git

      - uses: actions/checkout@v4

      - name: Make sure libraries are installed
        shell: bash
        run: |
          for lib in libcurl.a libssl.a libvita2d.a libfreetype.a libpng.a; do
            if [ ! -f "$VITASDK/arm-vita-eabi/lib/$lib" ]; then
              echo "Missing $lib - installing packages with vdpm"
              vdpm curl openssl vita2d freetype libpng libjpeg-turbo zlib
              break
            fi
          done

      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: VitaGitHub
          path: build/VitaGitHub.vpk

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VitaGitHub.vpk
